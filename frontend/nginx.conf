server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para rendimiento óptimo
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Manejo de rutas SPA (React Router fallback a index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché extendida para activos estáticos versionados
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy hacia el Backend de FastAPI
    location /api/ {
        proxy_pass http://marea-backend-svc:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Sonda de salud del frontend
    location /healthz {
        access_log off;
        return 200 "frontend-ok\n";
    }
}
