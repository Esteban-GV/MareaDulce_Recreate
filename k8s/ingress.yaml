apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marea-app-ingress
  namespace: recreate-lab
  labels:
    app.kubernetes.io/name: marea-app
    app.kubernetes.io/part-of: marea-dulce
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: recreate.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: marea-app-service
                port:
                  number: 80
