apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recreate-app-ingress
  namespace: recreate-lab
  labels:
    app.kubernetes.io/name: recreate-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: recreate.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: recreate-app-service
                port:
                  number: 80

