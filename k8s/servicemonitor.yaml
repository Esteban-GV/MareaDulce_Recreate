apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: marea-app-servicemonitor
  namespace: recreate-lab
  labels:
    release: prometheus-stack
    app.kubernetes.io/name: marea-app
    app.kubernetes.io/part-of: marea-dulce
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: marea-app
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
      scrapeTimeout: 3s
