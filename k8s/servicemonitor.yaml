apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: recreate-app-servicemonitor
  namespace: recreate-lab
  labels:
    app.kubernetes.io/name: recreate-app
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: recreate-app
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
      scrapeTimeout: 3s

