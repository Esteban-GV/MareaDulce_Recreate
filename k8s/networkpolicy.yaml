apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: marea-dulce-network-policy
  namespace: recreate-lab
  labels:
    app.kubernetes.io/part-of: marea-dulce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: marea-dulce
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1. Tráfico HTTP desde Ingress NGINX al microservicio unificado
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    # 2. Recolección de métricas por Prometheus desde el namespace monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Resolución DNS del clúster (CoreDNS en kube-system)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
