apiVersion: apps/v1
kind: Deployment
metadata:
  name: marea-app-deployment
  namespace: recreate-lab
  labels:
    app.kubernetes.io/name: marea-app
    app.kubernetes.io/part-of: marea-dulce
    app.kubernetes.io/version: "2.0.0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: marea-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marea-app
        app.kubernetes.io/part-of: marea-dulce
        app.kubernetes.io/version: "2.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: marea-app:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: APP_VERSION
              value: "2.0.0"
            - name: DATABASE_PATH
              value: "/data/marea_dulce.db"
            - name: DEMO_MODE
              value: "true"
            - name: ADMIN_EMAIL
              value: "admin@mareadulce.com"
            - name: ADMIN_PASSWORD
              value: "AdminMarea2026!"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: db-storage
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: recreate-app-pvc
