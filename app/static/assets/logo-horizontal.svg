<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 70" width="380" height="70" fill="none">
  <!-- Marea Dulce Logo Horizontal -->
  <defs>
    <linearGradient id="logoWaveGrad" x1="5" y1="55" x2="55" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#245B59"/>
      <stop offset="60%" stop-color="#56C7B6"/>
      <stop offset="100%" stop-color="#A9E0D6"/>
    </linearGradient>
  </defs>
  
  <!-- Isotipo (60x60 viewBox equivalente) -->
  <g transform="translate(6, 5) scale(0.6)">
    <path d="M14 82 C 28 84, 45 78, 55 64 C 64 51, 62 34, 48 30 C 36 26, 28 35, 30 46 C 32 54, 41 58, 48 54 C 53 51, 54 44, 50 40 C 47 37, 42 38, 41 41 C 40 43, 42 45, 44 45" 
          stroke="url(#logoWaveGrad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <path d="M52 28 C 66 18, 84 26, 82 46 C 80 62, 62 76, 42 82 C 60 84, 82 74, 88 56 C 92 42, 84 22, 66 16 C 54 12, 42 18, 38 24" 
          stroke="#56C7B6" 
          stroke-width="5.5" 
          stroke-linecap="round"/>
    <circle cx="43" cy="42" r="4" fill="#ED978C"/>
  </g>

  <!-- Tipografía Marea Dulce (Fraunces serif) -->
  <text x="76" y="38" font-family="'Fraunces', 'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="#245B59" letter-spacing="-0.5">Marea Dulce</text>
  <!-- Eslogan -->
  <text x="78" y="55" font-family="'DM Sans', 'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#5F625E" letter-spacing="0.4">Pequeños antojos, grandes momentos.</text>
</svg>
