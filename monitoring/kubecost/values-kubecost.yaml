# ==============================================================================
# Valores de Helm: Kubecost (cost-analyzer) optimizado para Minikube
# ==============================================================================

global:
  clusterId: minikube-recreate-lab
  prometheus:
    # Integrar con el Prometheus existente de kube-prometheus-stack
    enabled: false
    fqdn: http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090

prometheus:
  server:
    global:
      external_labels:
        cluster_id: minikube-recreate-lab

kubecostModel:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

kubecostFrontend:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Deshabilitar módulos de red/cloud no necesarios en entorno local para evitar advertencias en la UI
networkCosts:
  enabled: false
clusterController:
  enabled: false

kubecostProductConfigs:
  clusterName: minikube-recreate-lab
  currencyCode: USD
