# ==============================================================================
# Valores de Helm: Kubecost (cost-analyzer) optimizado para Minikube
# ==============================================================================

global:
  prometheus:
    # Usar la instancia existente de Prometheus en kube-prometheus-stack
    enabled: false
    fqdn: http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090

kubecostModel:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

kubecostFrontend:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

